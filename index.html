<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Hacking Game</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #00ff00;
            --accent-color: #1e1e1e;
            --border-color: #00ff00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--accent-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .settings {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }

        .settings label {
            margin-right: 5px;
        }

        #game-output {
            height: 250px;
            overflow-y: auto;
            border: 1px dashed var(--border-color);
            padding: 10px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #000;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            font-family: inherit;
        }

        button {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Color Scheme Adjustments -->
        <div class="settings">
            <div>
                <label for="bgPicker">BG:</label>
                <input type="color" id="bgPicker" value="#121212">
            </div>
            <div>
                <label for="textPicker">Text:</label>
                <input type="color" id="textPicker" value="#00ff00">
            </div>
            <div>
                <label for="cardPicker">Card:</label>
                <input type="color" id="cardPicker" value="#1e1e1e">
            </div>
        </div>

        <h2 style="text-align: center; margin-top: 0;">#The Official Hacking Game#</h2>
        
        <div id="game-output"></div>

        <div class="input-area">
            <input type="text" id="guessInput" placeholder="Guess the password..." autofocus>
            <button id="submitBtn" onclick="makeGuess()">Guess</button>
        </div>
    </div>

    <script>
        let attemptNum = 5;
        const secretWord = "yeet";
        const outputDiv = document.getElementById("game-output");
        const guessInput = document.getElementById("guessInput");
        const submitBtn = document.getElementById("submitBtn");

        // Customization Listeners
        document.getElementById("bgPicker").addEventListener("input", (e) => {
            document.documentElement.style.setProperty('--bg-color', e.target.value);
        });
        document.getElementById("textPicker").addEventListener("input", (e) => {
            document.documentElement.style.setProperty('--text-color', e.target.value);
            document.documentElement.style.setProperty('--border-color', e.target.value);
        });
        document.getElementById("cardPicker").addEventListener("input", (e) => {
            document.documentElement.style.setProperty('--accent-color', e.target.value);
        });

        function appendOutput(text) {
            outputDiv.innerHTML += text + "<br>";
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function displayAttempts(x) {
            appendOutput(`You have ${x} attempts left.`);
        }

        function giveHint(attempt) {
            if (attempt === 5) {
                appendOutput("This word is a modern, funny word. Many teenagers use this word often.");
            } else if (attempt === 4) {
                appendOutput("This word is four letters.");
            } else if (attempt === 3) {
                appendOutput("The word has two of the same vowels that sit right next to each other.");
            } else if (attempt === 2) {
                appendOutput("The word starts with a Y.");
            }
        }

        // Initialize Game
        appendOutput("The Hacking Game 101");
        appendOutput("This password is one word. You have five attempts to guess it correctly.\n");

        function makeGuess() {
            if (attemptNum <= 0) return;

            const guess = guessInput.value.trim();
            guessInput.value = "";

            if (!guess) return;

            appendOutput(`> ${guess}`);

            if (guess.toLowerCase() === secretWord) {
                appendOutput("YOU GOT IT. YOU ARE A AWESOME HACKER!");
                endGame();
                return;
            }

            attemptNum--;

            if (attemptNum > 0) {
                appendOutput("You are incorrect.");
                giveHint(attemptNum + 1);
                displayAttempts(attemptNum);
                appendOutput("");
            } else {
                appendOutput("YOU LOST YOU LAZY GOOD FOR NOTHING COUCH POTATO (im kidding bestie just play again by refreshing the page!)");
                endGame();
            }
        }

        function endGame() {
            guessInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.innerText = "Over";
        }

        // Allow pressing Enter to submit
        guessInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                makeGuess();
            }
        });
    </script>
</body>
</html>
