<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Hacking Game</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #00ff33;
            --card-bg: #050505;
            --accent-color: #00ff33;
            --error-color: #ff0033;
        }

        body.custom-theme {
            --bg-color: var(--user-bg, #000000);
            --card-bg: var(--user-card, #050505);
            --text-color: var(--user-text, #00ff33);
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 0px; /* Completely sharp corners */
            border: 2px solid var(--text-color);
            box-shadow: 0 0 20px rgba(0, 255, 51, 0.2);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 1rem;
            margin-top: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 51, 0.6);
        }

        .customizer-box {
            display: flex;
            gap: 1rem;
            background: #0a0a0a;
            padding: 1rem;
            border-radius: 0px; /* Completely sharp corners */
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            border: 1px dashed var(--text-color);
        }

        .control-group {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="color"] {
            width: 100%;
            height: 35px;
            border: 1px solid var(--text-color);
            border-radius: 0px; /* Completely sharp corners */
            cursor: pointer;
            background: none;
        }

        .terminal {
            background: #000000;
            padding: 1rem;
            border-radius: 0px; /* Completely sharp corners */
            border: 1px solid var(--text-color);
            height: 250px;
            margin-bottom: 1.5rem;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 255, 51, 0.3);
        }

        .game-input-area {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            background: #000000;
            border: 1px solid var(--text-color);
            color: inherit;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 0px; /* Completely sharp corners */
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(0, 255, 51, 0.5);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            color: #000000;
            border: none;
            font-family: inherit;
            font-weight: bold;
            border-radius: 0px; /* Completely sharp corners */
            cursor: pointer;
            text-transform: uppercase;
        }

        #submit-btn {
            background-color: var(--text-color);
            font-weight: 900;
        }

        #submit-btn:hover {
            background-color: #00cc22;
            box-shadow: 0 0 8px rgba(0, 255, 51, 0.5);
        }

        #reset-btn {
            background-color: #111111;
            color: var(--text-color);
            border: 1px solid var(--text-color);
        }

        #reset-btn:hover {
            background-color: #222222;
        }

        button:disabled, input:disabled {
            background-color: #111111 !important;
            color: #333333 !important;
            border-color: #333333 !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .error-text { 
            color: var(--error-color); 
            text-shadow: 0 0 5px rgba(255, 0, 51, 0.5);
        }
        .success-text { 
            color: var(--text-color); 
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 51, 0.5);
        }
        .system-text { 
            color: #00aa22; 
        }
    </style>
</head>

        <div class="customizer-box">

                <input type="color" id="card-picker" value="#050505" oninput="changeThemeColor('--user-card', this.value)">

            document.body.classList.add('custom-theme');

                }
            }
            return count;
        }

            entry.innerText = text;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }
