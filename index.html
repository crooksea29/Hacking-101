<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Hacking Game</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #00ff00;
            --accent-color: #1a331a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Customization Panel Styles */
        .controls {
            background-color: var(--accent-color);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--text-color);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: bold;
        }

        input[type="color"], select {
            background-color: #222;
            border: 1px solid var(--text-color);
            color: white;
            padding: 5px;
            cursor: pointer;
        }

        /* Terminal Window Styles */
        .terminal {
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--text-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 15px;
            line-height: 1.5;
            max-height: 400px;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            margin-right: 10px;
            font-weight: bold;
        }

        .guess-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 5px 15px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Customization Settings Layout -->
    <div class="controls">
        <div class="control-group">
            <label for="bgPicker">Background:</label>
            <input type="color" id="bgPicker" value="#0d0d0d" onchange="updateBgColor(this.value)">
        </div>
        
        <div class="control-group">
            <label for="schemeSelector">Color Theme:</label>
            <select id="schemeSelector" onchange="changeScheme(this.value)">
                <option value="matrix">Classic Matrix (Green)</option>
                <option value="cyberpunk">Cyberpunk (Amber/Yellow)</option>
                <option value="mainframe">Mainframe (Cyan)</option>
                <option value="stealth">Stealth (White)</option>
            </select>
        </div>
        
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <!-- Terminal Board Layout -->
    <div class="terminal">
        <div class="output" id="terminalOutput"></div>
        <div class="input-line" id="inputContainer">
            <span class="prompt">Guess the password:&gt;</span>
            <input type="text" id="guessInput" class="guess-input" autofocus autocomplete="off">
        </div>
    </div>
</div>

<script>
    // Game State Variables
    let attemptNum = 5;
    const password = "yeet";
    const outputDiv = document.getElementById("terminalOutput");
    const guessInput = document.getElementById("guessInput");
    const inputContainer = document.getElementById("inputContainer");

    // Print text safely to terminal window
    function printToTerminal(text) {
        outputDiv.innerText += text + "\n";
        outputDiv.scrollTop = outputDiv.scrollHeight; // Auto-scrolls window down
    }

    // Process letter-match calculation logic
    function getLetterCount(guess) {
        let cleanGuess = guess.toLowerCase();
        let matchCount = 0;
        for (let char of cleanGuess) {
            if (char === 'y' || char === 'e' || char === 't') {
                matchCount++;
            }
        }
        return matchCount;
    }

    // Handles the core submission logic loop
    function handleGuess() {
        let guess = guessInput.value;
        if (!guess.trim()) return; // skip empty line enters

        printToTerminal(`Guess the password:> ${guess}`);
        guessInput.value = "";

        if (guess.toLowerCase() === password) {
            printToTerminal("\nYOU GOT IT. YOU ARE AN AWESOME HACKER!");
            inputContainer.style.display = "none"; // Hide input window
            return;
        }

        attemptNum--;
        printToTerminal("You are incorrect.");

        if (attemptNum > 0) {
            // Calculate and display matching letters matching core python framework
            let count = getLetterCount(guess);
            printToTerminal(`You have ${count} correct core letters.`);
            
            // Map remaining attempts to correct contextual hints matching original code block order
            if (attemptNum === 4) printToTerminal("Hint: This word is a modern, funny word. Many teenagers use this word often.");
            if (attemptNum === 3) printToTerminal("Hint: This word is four letters.");
            if (attemptNum === 2) printToTerminal("Hint: The word has two of the same vowels that sit right next to each other.");
            if (attemptNum === 1) printToTerminal("Hint: The word starts with a Y.");

            printToTerminal(`You have ${attemptNum} attempts left.\n`);
        } else {
            printToTerminal("\nYOU LOST YOU LAZY GOOD FOR NOTHING COUCH POTATO. THE PASSWORD WAS YEET.");
            inputContainer.style.display = "none";
        }
    }

    // UI Customization Functions
    function updateBgColor(color) {
        document.documentElement.style.setProperty('--bg-color', color);
    }

    function changeScheme(theme) {
        const root = document.documentElement;
        if (theme === 'matrix') {
            root.style.setProperty('--text-color', '#00ff00');
            root.style.setProperty('--accent-color', '#1a331a');
        } else if (theme === 'cyberpunk') {
            root.style.setProperty('--text-color', '#ffb000');
            root.style.setProperty('--accent-color', '#332600');
        } else if (theme === 'mainframe') {
            root.style.setProperty('--text-color', '#00ffff');
            root.style.setProperty('--accent-color', '#002626');
        } else if (theme === 'stealth') {
            root.style.setProperty('--text-color', '#ffffff');
            root.style.setProperty('--accent-color', '#222222');
        }
        guessInput.focus();
    }

    // Restart Engine Initialization Block
    function resetGame() {
        attemptNum = 5;
        outputDiv.innerText = "";
        inputContainer.style.display = "flex";
        guessInput.value = "";
        guessInput.focus();
        printToTerminal("==================================================");
        printToTerminal("SYSTEM INITIALIZED: The Official Hacking Game v1.0");
        printToTerminal("==================================================\n");
    }

    // Capture "Enter" key press on the input bar
    guessInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            handleGuess();
        }
    });

    // Run the engine instantly on script mount
    resetGame();
</script>

</body>
</html>
